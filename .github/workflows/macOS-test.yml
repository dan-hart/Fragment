name: macOS Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build macOS
        run: xcodebuild -scheme macOS -configuration Debug build

      - name: Test macOS
        run: xcodebuild test -scheme macOS
